name: CI

# 정적 랜딩이라 단위 테스트의 값은 낮다. 다만 lint·build 조차 돌지 않으면
# 링크 상수 오타나 깨진 import 가 배포까지 그대로 간다 — 그것만 막는다.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
